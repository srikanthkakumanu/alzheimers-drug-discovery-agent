{
  "name": "Research Review",
  "on": {
    "push": {},
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Validate context and evidence contracts",
          "run": "python3 scripts/validate_repository.py"
        },
        {
          "name": "Exercise validation failure cases",
          "run": "python3 -m unittest discover -s tests -v"
        }
      ]
    }
  }
}
