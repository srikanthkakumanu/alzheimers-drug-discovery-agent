[project]
name = "neuroquest"
version = "0.1.0"
description = "Evidence-grounded decision support for Alzheimer's research (synthetic demonstration)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.66",
    "langsmith>=0.3",
]

[project.scripts]
neuroquest = "neuroquest.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroquest"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests/app"]
extend-exclude = ["scripts", "tests/test_*.py", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "ANN", "PT"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/app/**" = ["ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/neuroquest"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langsmith.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests/app"]
addopts = "-m 'not eval' --import-mode=importlib"
markers = ["eval: live LLM evaluation (needs provider API keys; may cost money)"]
